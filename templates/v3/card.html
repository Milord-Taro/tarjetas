<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{nombre}} — Tarjeta digital</title>
<meta name="description" content="Tarjeta de presentación digital de {{nombre}}, {{cargo_texto}} en {{marca.nombre}}.">
<meta name="theme-color" content="{{marca.color_carbon}}">
<!-- La tarjeta se reparte por QR y por WhatsApp, no se busca en Google; y no
     tiene por qué quedar indexada ni raspada por estar en un sitio público. -->
<meta name="robots" content="noindex, nofollow">

<link rel="stylesheet" href="./style.css">

<style>
  /* Variables de marca inyectadas en build. La v3 usa solo los cinco roles del
     manual, así que una marca nueva se pinta entera rellenando marcas.json →
     colores, sin tocar el CSS. */
  :root {
    --color-oscuro: {{marca.color_oscuro}};
    --color-claro: {{marca.color_claro}};
    --color-fondo: {{marca.color_fondo}};
    --color-apoyo: {{marca.color_apoyo}};
    --color-acento: {{marca.color_acento}};
    --fuente-marca: '{{marca.tipografia}}', sans-serif;
    {{logo_marca_css}}
  }
</style>
</head>
<body>
  <main class="tarjeta">

    <!-- Cabecera: dos capas con cortes distintos, como el arte del roll-up. Abajo
         el olivo con un corte diagonal simple; encima el carbón con un corte en
         chevron cuyo vértice cae al 20% del ancho. De ahí que la franja olivo se
         vea delgada a la derecha y como una cuña ancha a la izquierda. -->
    <header class="cabecera">
      <div class="cabecera__contenido">
        {{logo_claro_html}}
        <p class="cabecera__tagline">{{marca.tagline_html}}</p>
      </div>
    </header>

    <div class="cuerpo">

      <section class="identidad">
        <!-- El nombre es además el enlace de descarga de la tarjeta como imagen:
             se marca con subrayado punteado y una flecha para que se note que es
             clicable, en vez de repetir un botón aparte. -->
        <h1 class="identidad__nombre">
          <a class="identidad__descarga" href="{{base_recursos}}tarjeta-whatsapp.png" download="{{slug}}-whatsapp.png"
             title="Descargar la tarjeta como imagen, para compartir por WhatsApp"
             aria-label="{{nombre}} — descargar la tarjeta como imagen">
            <span class="identidad__pila">{{persona.nombre_pila}}</span> <span class="identidad__apellidos">{{persona.apellidos}}</span><svg class="identidad__icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><polyline points="7,11 12,16 17,11"/><path d="M4 20h16"/></svg>
          </a>
        </h1>
        <p class="identidad__cargo">{{cargo_html}}</p>
        <span class="identidad__regla" aria-hidden="true"></span>
      </section>

      <!-- Bloques de contacto: "Directo" (la persona) siempre encima de "Empresa".
           Se arman en build.mjs porque cada campo es opcional — una fila sin dato
           no debe existir, y una sección sin filas desaparece con su título. -->
      {{contactos_html}}

      <!-- Redes: los items son opcionales por persona, así que la fila se arma en build.mjs. -->
      <section class="redes" aria-label="Enlaces y redes">
        {{redes_html}}
      </section>

    </div>

    <!-- El pie llevaba el sitio web, que ya está arriba en la fila de redes. En su
         lugar va la acción principal: guardar el contacto. -->
    <footer class="pie">
      <a class="pie__accion" href="{{base_recursos}}contacto.vcf" download="{{slug}}.vcf">
        <svg class="pie__icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 20v-1.5a3.5 3.5 0 0 0-3.5-3.5h-3A3.5 3.5 0 0 0 6 18.5V20"/><circle cx="11" cy="8" r="3.2"/><path d="M19 8v5"/><path d="M16.5 10.5h5"/></svg>
        Guardar contacto
      </a>
    </footer>

  </main>
</body>
</html>
