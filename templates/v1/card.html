<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{nombre}} — Tarjeta digital</title>
<meta name="description" content="Tarjeta de presentación digital de {{nombre}}, {{cargo}} en {{marca.nombre}}.">
<!-- La tarjeta se reparte por QR y por WhatsApp, no se busca en Google; y no
     tiene por qué quedar indexada ni raspada por estar en un sitio público. -->
<meta name="robots" content="noindex, nofollow">

<link rel="stylesheet" href="./style.css">

<style>
  /* Variables de marca inyectadas en build — permiten reutilizar style.css con otras marcas a futuro. */
  :root {
    --color-oscuro: {{marca.color_oscuro}};
    --color-claro: {{marca.color_claro}};
    --color-fondo: {{marca.color_fondo}};
    --fuente-marca: '{{marca.tipografia}}', sans-serif;
    {{logo_marca_css}}
  }
</style>
</head>
<body>
  <main class="tarjeta">

    <header class="tarjeta__marca">
      {{logo_html}}
    </header>

    <section class="tarjeta__persona">
      <h1>{{nombre}}</h1>
      <p class="cargo">{{cargo}}</p>
    </section>

    <hr class="separador">

    <!-- Las secciones de contacto se arman en build.mjs: cada campo es opcional
         y las filas sin dato no deben existir. -->
    {{contactos_html}}

    <hr class="separador">

    <section class="enlaces" aria-label="Enlaces de marca">
      <a href="{{marca.sitio_web}}" target="_blank" rel="noopener">
        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        {{marca.sitio_web_display}}
      </a>
      <span class="enlaces__separador" aria-hidden="true">·</span>
      <a href="https://instagram.com/{{marca.instagram}}" target="_blank" rel="noopener">
        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.5" y2="6.5"/></svg>
        @{{marca.instagram}}
      </a>
    </section>

    <section class="acciones">
      <a class="boton" href="{{base_recursos}}contacto.vcf" download="{{slug}}.vcf">Guardar contacto</a>
      <a class="enlace-secundario" href="{{base_recursos}}tarjeta-whatsapp.png" download="{{slug}}-whatsapp.png">Descargar imagen para WhatsApp</a>
    </section>

    <section class="qr">
      <img src="{{base_recursos}}qr.png" alt="Código QR con enlace a la tarjeta de {{nombre}}" width="200" height="200" loading="lazy">
      <p class="qr__caption">Escanea para ver mi tarjeta digital</p>
    </section>

  </main>
</body>
</html>
