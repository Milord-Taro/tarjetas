# Publica dist/ tal cual está commiteado. El build no corre aquí a propósito:
# generar_imagenes.py depende de Pillow y de las fuentes locales, y el QR debe
# revisarse a ojo antes de imprimirse, así que se genera en local y se versiona.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
    paths: ['dist/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si se empujan dos veces seguidas, que gane la última sin cancelar un deploy en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # Las acciones van ancladas al SHA del commit y no al tag: un tag se puede
    # mover, así que "@v4" no garantiza que mañana corra el mismo código con el
    # que se revisó este workflow. El comentario deja a la vista qué versión es
    # cada SHA; para actualizar, se mueve el par SHA + comentario a la vez.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
